<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Tiles - Printer Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
      color: #1a1a2e;
    }
    .status-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .status-card h2 {
      font-size: 14px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .status-row:last-child {
      border-bottom: none;
    }
    .status-label {
      font-size: 14px;
      color: #555;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
    }
    .status-connected { color: #22c55e; }
    .status-mock { color: #f59e0b; }
    .status-error { color: #ef4444; }
    .status-unknown { color: #9ca3af; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: #1a1a2e;
      color: white;
    }
    .btn-primary:hover {
      background: #2d2d44;
    }
    .btn-secondary {
      background: white;
      color: #1a1a2e;
      border: 2px solid #1a1a2e;
    }
    .btn-secondary:hover {
      background: #f8f8f8;
    }
    .btn-success {
      background: #22c55e;
      color: white;
    }
    .btn-success:hover {
      background: #16a34a;
    }

    .log {
      background: #1a1a2e;
      color: #a5f3fc;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 16px;
    }
    .log-entry {
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .log-time {
      color: #64748b;
      margin-right: 8px;
    }
    .log-ok { color: #86efac; }
    .log-err { color: #fca5a5; }
    .log-info { color: #a5f3fc; }

    .receipt-preview {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .receipt-preview h3 {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      margin-bottom: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖨️ Printer Test Console</h1>

    <div class="status-card">
      <h2>Printer Status</h2>
      <div class="status-row">
        <span class="status-label">Status</span>
        <span class="status-value status-unknown" id="statusText">Checking...</span>
      </div>
      <div class="status-row">
        <span class="status-label">Mode</span>
        <span class="status-value" id="modeText">-</span>
      </div>
      <div class="status-row">
        <span class="status-label">Connected Printer</span>
        <span class="status-value" id="printerText">-</span>
      </div>
      <div class="status-row">
        <span class="status-label">Last Error</span>
        <span class="status-value status-error" id="errorText">-</span>
      </div>
    </div>

    <button class="btn btn-primary" id="btnDetect">🔍 Detect Printer</button>
    <button class="btn btn-secondary" id="btnTestPage">🧪 Print Test Page</button>
    <button class="btn btn-success" id="btnSampleReceipt">🧾 Print Sample Receipt</button>

    <div class="receipt-preview">
      <h3>Sample Receipt Preview</h3>
      <div id="receiptPreview">Press "Print Sample Receipt" to generate...</div>
    </div>

    <div class="log" id="log">
      <div class="log-entry"><span class="log-time">--:--:--</span><span class="log-info">Printer test console ready</span></div>
    </div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const statusText = document.getElementById('statusText');
    const modeText = document.getElementById('modeText');
    const printerText = document.getElementById('printerText');
    const errorText = document.getElementById('errorText');
    const receiptPreview = document.getElementById('receiptPreview');

    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : 'log-info';
      entry.innerHTML = `<span class="log-time">${time}</span><span class="${cls}">${msg}</span>`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateStatus(status) {
      statusText.textContent = status.status;
      statusText.className = 'status-value status-' + status.status;
      modeText.textContent = status.isMockMode ? 'Mock (No Hardware)' : 'Hardware';
      printerText.textContent = status.connectedPrinter || 'None detected';
      errorText.textContent = status.lastError || 'None';
    }

    async function refreshStatus() {
      try {
        const status = await window.electronAPI.printer.getStatus();
        updateStatus(status);
      } catch (e) {
        log('Failed to get status: ' + e.message, 'err');
      }
    }

    document.getElementById('btnDetect').addEventListener('click', async () => {
      log('Detecting printer...');
      try {
        const status = await window.electronAPI.printer.detect();
        updateStatus(status);
        if (status.status === 'connected') {
          log('Printer connected: ' + status.connectedPrinter, 'ok');
        } else if (status.status === 'mock') {
          log('Running in mock mode (no hardware)', 'info');
        } else {
          log('No printer found', 'err');
        }
      } catch (e) {
        log('Detection error: ' + e.message, 'err');
      }
    });

    document.getElementById('btnTestPage').addEventListener('click', async () => {
      log('Sending test page...');
      try {
        const result = await window.electronAPI.printer.printTestPage();
        if (result) {
          log('Test page printed successfully!', 'ok');
        } else {
          log('Test page failed. Check printer connection.', 'err');
        }
        refreshStatus();
      } catch (e) {
        log('Print error: ' + e.message, 'err');
      }
    });

    document.getElementById('btnSampleReceipt').addEventListener('click', async () => {
      const sampleSale = {
        receiptNumber: 'FT-2026-000001',
        date: new Date().toLocaleString(),
        cashier: 'Admin User',
        customerName: 'Test Customer',
        customerPhone: '0801-234-5678',
        items: [
          { name: 'Spanish Marble Tile 60x60', quantity: 5.00, unitPrice: 12500.00, totalPrice: 62500.00, unitOfMeasure: 'sqm' },
          { name: 'Porcelain Floor White', quantity: 3.00, unitPrice: 8000.00, totalPrice: 24000.00, unitOfMeasure: 'sqm' },
          { name: 'Ceramic Wall Blue', quantity: 2.50, unitPrice: 6500.00, totalPrice: 16250.00, unitOfMeasure: 'sqm' }
        ],
        subtotal: 102750.00,
        discountType: 'percentage',
        discountValue: 5,
        total: 97612.50,
        paymentMethod: 'cash',
        tendered: 100000.00,
        change: 2387.50
      };

      // Build preview text
      const preview = [
        'FORTUNE TILES',
        '123 Warehouse Road',
        'Lagos, Nigeria',
        '0800-123-4567',
        '--------------------------------',
        `Receipt: ${sampleSale.receiptNumber}`,
        `Date: ${sampleSale.date}`,
        `Cashier: ${sampleSale.cashier}`,
        `Customer: ${sampleSale.customerName}`,
        '--------------------------------',
        ...sampleSale.items.map(i => `${i.name}\n  ${i.quantity} ${i.unitOfMeasure} x ₦${i.unitPrice.toLocaleString()}    ₦${i.totalPrice.toLocaleString()}`),
        '--------------------------------',
        `Subtotal:                   ₦${sampleSale.subtotal.toLocaleString()}`,
        `Discount (5%):              -₦${(sampleSale.subtotal * 0.05).toLocaleString()}`,
        `TOTAL:                      ₦${sampleSale.total.toLocaleString()}`,
        `Payment: ${sampleSale.paymentMethod.toUpperCase()}`,
        `Tendered:                   ₦${sampleSale.tendered.toLocaleString()}`,
        `Change:                     ₦${sampleSale.change.toLocaleString()}`,
        '--------------------------------',
        'Thank you for your business!',
        'Goods sold in good condition',
        'are non-refundable.',
        '--------------------------------',
        `[BARCODE: ${sampleSale.receiptNumber}]`,
        '[CUT]'
      ].join('\n');

      receiptPreview.textContent = preview;
      log('Sending sample receipt...');

      try {
        const result = await window.electronAPI.printer.printReceipt(sampleSale);
        if (result) {
          log('Sample receipt printed!', 'ok');
        } else {
          log('Sample receipt failed. Check printer.', 'err');
        }
        refreshStatus();
      } catch (e) {
        log('Print error: ' + e.message, 'err');
      }
    });

    // Initial status
    refreshStatus();
  </script>
</body>
</html>
